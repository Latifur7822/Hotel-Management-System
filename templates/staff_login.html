<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAM International - Staff Portal</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }
        body { 
            background: #ecf0f3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            position: relative; 
        }
        body::before, body::after { 
            content: ''; 
            position: absolute; 
            background: #ecf0f3; 
            border-radius: 50%; 
            box-shadow: inset 7px 7px 14px #d1d5db, inset -7px -7px 14px #ffffff; 
        }
        body::before { width: 140px; height: 140px; top: 12%; left: 15%; }
        body::after { width: 90px; height: 90px; bottom: 12%; right: 15%; }
        
        .login-box { 
            width: 380px; 
            padding: 40px 30px; 
            background: #ecf0f3; 
            border-radius: 40px; 
            box-shadow: 15px 15px 30px #d1d5db, -15px -15px 30px #ffffff; 
            text-align: center; 
            z-index: 10;
        }
        .icon-circle { 
            width: 70px; 
            height: 70px; 
            margin: 0 auto 20px auto; 
            background: #ecf0f3; 
            border-radius: 50%; 
            box-shadow: 5px 5px 10px #d1d5db, -5px -5px 10px #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #0072ff; 
            font-size: 26px; 
        }
        h2 { 
            color: #2c3e50; 
            font-size: 24px; 
            font-weight: 600;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 25px;
            margin-top: 5px;
        }
        .form-field {
            margin-bottom: 15px;
        }
        input, select, button { 
            width: 100%; 
            padding: 14px 20px; 
            border: none; 
            border-radius: 25px; 
            outline: none; 
            font-size: 15px;
            background: #ecf0f3; 
            transition: all 0.3s ease;
        }
        input, select {
            color: #333;
            box-shadow: inset 5px 5px 8px #d1d5db, inset -5px -5px 8px #ffffff; 
        }
        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        input:focus {
            box-shadow: inset 2px 2px 5px #d1d5db, inset -2px -2px 5px #ffffff;
        }
        button { 
            background: #0072ff; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 15px;
            box-shadow: 5px 5px 10px #d1d5db, -5px -5px 10px #ffffff; 
        }
        button:hover { 
            background: #0056c6; 
            box-shadow: 0px 8px 25px rgba(0, 114, 255, 0.3);
        }
        button:active {
            box-shadow: inset 4px 4px 6px #0056c6, inset -4px -4px 6px #338eff;
        }
        .back-link { 
            margin-top: 25px; 
            font-size: 13px; 
            display: block; 
            color: #7f8c8d; 
            text-decoration: none; 
            transition: 0.2s;
        }
        .back-link:hover {
            color: #0072ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="icon-circle">💼</div>
        <h2>LAM International</h2>
        <p class="subtitle">Management & Staff Portal</p>
        
        <form action="/staff-login" method="POST">
            <!-- 👥 রোল সিলেক্ট করার অপশন -->
            <div class="form-field">
                <select name="role_type" required>
                    <option value="employee">👨‍💼 Employee Portal</option>
                    <option value="admin">👑 Admin Portal</option>
                </select>
            </div>
            
            <div class="form-field">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="form-field">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            
            <button type="submit">Secure Login</button>
        </form>
        {% if error %}<p style="margin-top:15px;color:#e74c3c;font-size:13px;font-weight:600;">{{ error }}</p>{% endif %}
        
        <a href="/" class="back-link">← Back to Main Hotel Website</a>
    </div>

</body>
</html>
